# Teste no emulador Android: roda o app de verdade (WebView de verdade, toques pelo caminho do dedo) contra um servidor local com
# Firebase simulado, repete o roteiro de toques de Concertos e guarda vídeo, logcat e relatórios. NÃO publica nada: só gera artefatos.
# Dispara a cada envio na branch "teste-emulador" (ou manualmente em Actions > "Teste no emulador (Android)").
name: Teste no emulador (Android)

on:
  push:
    branches: [teste-emulador]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulador:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [36]
        acessibilidade: [nao]
        os: [60]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Build de teste: abre o servidor local (10.0.2.2 = o computador, visto de dentro do emulador), aceita http e liga o DevTools.
      - name: Compilar (build de teste)
        working-directory: apk
        run: |
          gradle --no-daemon assembleDebug \
            -Pcanal=beta -Pteste=sim \
            -PstartUrl='http://10.0.2.2:8123/index.html?shell=mobile'

      - name: Sondar fontes de um WebView mais novo (temporário)
        continue-on-error: true
        run: |
          echo "--- imagens de sistema 36/37 e prévias"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --list 2>/dev/null | grep -E "system-images;android-(3[6-9]|Cinnamon|Baklava)" | head -20 || true
          echo "--- pastas do bucket de builds do Chromium"
          curl -s "https://storage.googleapis.com/storage/v1/b/chromium-browser-snapshots/o?delimiter=/" | head -c 800 || true
          echo; echo "--- Android_x64 (último)"
          curl -s "https://storage.googleapis.com/chromium-browser-snapshots/Android_x64/LAST_CHANGE" | head -c 100 || true
          echo; echo "--- versões do WebView no Google (omahaproxy/chromiumdash)"
          curl -s "https://chromiumdash.appspot.com/fetch_releases?channel=Stable&platform=Android&num=1" | head -c 400 || true
          echo

      - name: Liberar o KVM (aceleração do emulador)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Rodar o roteiro no emulador
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ACESSIBILIDADE: ${{ matrix.acessibilidade }}
          OS_QTD: ${{ matrix.os }}
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash teste-emulador/rodar.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultado-emulador-api${{ matrix.api }}-os-${{ matrix.os }}
          path: resultado
          if-no-files-found: warn
