# Publica a pasta app/ no GitHub Pages (link de teste/beta) a cada envio na main.
# O link oficial dos clientes continua sendo o Firebase Hosting (deploy manual pelo PC).
# Requer: Settings > Pages > Source = "GitHub Actions".
name: Publicar teste (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Montar o site (sem a ferramenta de criar loja)
        run: |
          mkdir _site
          cp -r app/. _site/
          rm -f _site/admin-criar-loja.html
          touch _site/.nojekyll
          # Carimba a versão (data + código do envio): é isso que o app compara pra saber que
          # tem atualização (ver app/atualizacao.js). Sem carimbo o envio falha, em vez de ficar
          # sem aviso de atualização.
          VERSAO="$(date -u +%Y-%m-%d).${GITHUB_SHA::7}"
          sed -i "s/window\._VS_VERSAO = '[^']*'/window._VS_VERSAO = '${VERSAO}'/" _site/index.html
          grep -q "window._VS_VERSAO = '${VERSAO}'" _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
