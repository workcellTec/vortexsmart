# Gera o APK do VortexSmart (app Android com WebView próprio, independente do Chrome).
# Como usar: aba Actions > "Gerar APK (Android)" > Run workflow. Pronto em ~5 min; o link direto vem no fim da execução.
# Dois canais, que nunca se misturam:
#   • beta (padrão): app "VortexSmart Beta" (app.vortexsmart.beta), instala ao lado do oficial, abre o site de teste
#     (GitHub Pages, atualizado a cada envio na main) e se atualiza pela Release "apk-beta".
#   • oficial: app dos clientes (app.vortexsmart), abre o Firebase Hosting e se atualiza pela Release "apk-latest".
# O APK abre o endereço do canal, então cada deploy do site já atualiza o app — só gere um APK novo se mudar a parte Android.
# Requer o segredo APK_SENHA (Settings > Secrets and variables > Actions): uma senha forte escolhida por você;
# ela protege a chave de assinatura (guardada criptografada em apk/vortexsmart.jks.enc). Sem ela o build para.
name: Gerar APK (Android)

on:
  workflow_dispatch:
    inputs:
      canal:
        description: 'Canal: beta = app de teste separado (padrão); oficial = o app dos clientes'
        type: choice
        options: [beta, oficial]
        default: beta
      endereco:
        description: 'Endereço que o app abre (vazio = o do canal: beta abre o GitHub Pages, oficial abre o Firebase Hosting)'
        required: false
        default: ''
      novidades:
        description: 'O que mudou (aparece pro cliente na janela de atualização do app)'
        required: true
        default: 'Melhorias e correções.'
      obrigatoria:
        description: 'Atualização obrigatória? (o cliente não consegue tocar em "Depois")'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      APK_SENHA: ${{ secrets.APK_SENHA }}
    steps:
      - uses: actions/checkout@v4

      - name: Conferir segredo
        run: |
          if [ -z "$APK_SENHA" ]; then
            echo "::error::Falta o segredo APK_SENHA (Settings > Secrets and variables > Actions > New repository secret)."
            exit 1
          fi

      # Resolve tudo que muda entre os canais num lugar só. Trava o erro perigoso: APK oficial (o dos clientes) abrindo o site de teste.
      - name: Definir canal
        id: canal
        env:
          CANAL: ${{ inputs.canal }}
          ENDERECO: ${{ inputs.endereco }}
        run: |
          if [ "$CANAL" = "beta" ]; then
            TAG=apk-beta; SUFIXO=-beta; PADRAO='https://workcelltec.github.io/vortexsmart/'
          else
            TAG=apk-latest; SUFIXO=''; PADRAO='https://vortex-b3761.web.app/'
          fi
          URL="${ENDERECO:-$PADRAO}"
          if [ "$CANAL" = "oficial" ] && echo "$URL" | grep -q 'github\.io'; then
            echo "::error::O APK oficial (dos clientes) não pode abrir o site de teste. Use o canal beta."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sufixo=$SUFIXO" >> "$GITHUB_OUTPUT"
          echo "endereco=$URL" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # Na 1ª vez cria a chave de assinatura com a senha do segredo APK_SENHA, guarda ela CRIPTOGRAFADA
      # no repositório (apk/vortexsmart.jks.enc) e reaproveita nas próximas. Ninguém além de quem
      # tem a senha consegue abrir. Guarde a senha: sem ela o APK instalado não recebe atualização por cima.
      - name: Chave de assinatura
        run: |
          CHAVE="$RUNNER_TEMP/vortexsmart.jks"
          if [ -f apk/vortexsmart.jks.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -in apk/vortexsmart.jks.enc -out "$CHAVE" -pass env:APK_SENHA
          else
            keytool -genkeypair -keystore "$CHAVE" -alias vortexsmart -keyalg RSA -keysize 2048 -validity 36500 \
              -storepass "$APK_SENHA" -keypass "$APK_SENHA" -dname "CN=VortexSmart, O=Workcell, C=BR"
            openssl enc -aes-256-cbc -pbkdf2 -salt -in "$CHAVE" -out apk/vortexsmart.jks.enc -pass env:APK_SENHA
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add apk/vortexsmart.jks.enc
            git commit -m "chore(apk): chave de assinatura (criptografada)"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Compilar
        working-directory: apk
        env:
          ENDERECO: ${{ steps.canal.outputs.endereco }}
        run: |
          gradle --no-daemon assembleRelease \
            -Pcanal="${{ inputs.canal }}" \
            -PstartUrl="$ENDERECO" \
            -PversionCode="${{ github.run_number }}" \
            -PversionName="1.0.${{ github.run_number }}${{ steps.canal.outputs.sufixo }}" \
            -PksPath="$RUNNER_TEMP/vortexsmart.jks" \
            -PksSenha="$APK_SENHA"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/VortexSmart.apk"

      # apk-versao.json: o app instalado consulta este arquivo pra saber se há versão nova (ver Atualizador.java).
      - name: Descrever a versão
        env:
          NOVIDADES: ${{ inputs.novidades }}
          OBRIGATORIA: ${{ inputs.obrigatoria }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          t = os.environ['RUNNER_TEMP']
          apk = open(t + '/VortexSmart.apk', 'rb').read()
          json.dump({
              'versionCode': int('${{ github.run_number }}'),
              'versionName': '1.0.${{ github.run_number }}${{ steps.canal.outputs.sufixo }}',
              'notas': os.environ['NOVIDADES'].strip(),
              'obrigatoria': os.environ['OBRIGATORIA'] == 'true',
              'tamanho': len(apk),
              'sha256': hashlib.sha256(apk).hexdigest(),
          }, open(t + '/apk-versao.json', 'w', encoding='utf-8'), ensure_ascii=False, indent=2)
          PY

      # Cada canal mexe só na própria Release: publicar o beta nunca troca o APK que os clientes recebem.
      - name: Publicar em Releases
        env:
          GH_TOKEN: ${{ github.token }}
          ENDERECO: ${{ steps.canal.outputs.endereco }}
          TAG: ${{ steps.canal.outputs.tag }}
          SUFIXO: ${{ steps.canal.outputs.sufixo }}
        run: |
          EXTRA=""; TITULO="VortexSmart APK"
          if [ "$TAG" = "apk-beta" ]; then EXTRA="--prerelease"; TITULO="VortexSmart APK (beta)"; fi
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" "$RUNNER_TEMP/VortexSmart.apk" "$RUNNER_TEMP/apk-versao.json" \
            --title "$TITULO" $EXTRA \
            --notes "APK 1.0.${{ github.run_number }}${SUFIXO} (commit ${GITHUB_SHA::7}) — abre $ENDERECO" \
            --target "$GITHUB_SHA"
          echo "### APK pronto (${{ inputs.canal }})" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/${{ github.repository }}/releases/download/${TAG}/VortexSmart.apk" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: VortexSmart-apk
          path: ${{ runner.temp }}/VortexSmart.apk
